name: Lint

on: [push, pull_request]

jobs:
  LintCode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements_dev.txt
      - name: Check code styling
        run: |
          mh_style +adi

  RunMetrics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements_dev.txt
      - name: Check code styling
        run: |
          mh_metrics +adi --html=metrics.html

      - name: Archive report
        uses: actions/upload-artifact@v4
        with:
          name: Metrics
          path: metrics.html
