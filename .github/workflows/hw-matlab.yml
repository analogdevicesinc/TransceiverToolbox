name: Hardware Tests (labgrid)

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * *"

jobs:
  hw-matlab:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'hw-test')
    uses: tfcollins/labgrid-plugins/.github/workflows/matlab-hw-request.yml@v3.5
    with:
      coordinator: ${{ vars.ADI_LG_COORDINATOR }}
      board-map: "test/hw_ci/board_map.yaml"
      runner-label: ${{ vars.HW_REQUEST_RUNNER || 'hw-lab' }}
      preflight-runner-label: ${{ vars.HW_PREFLIGHT_RUNNER || 'hw-coordinator' }}
      matlab-bin: ${{ vars.MATLAB_BIN }}
      wait: 1800
