name: libiio v1 bindings

# Hardware-free tests of the device classes on the libiio v1 MATLAB bindings
# (github.com/tfcollins/libiio-conv, package "iio"): adi.AD9361.Rx/Tx,
# adi.Pluto.Rx/Tx, adi.FMComms5.Rx/Tx, adi.ADRV9009.Rx/ORx/Tx,
# adi.ADRV9009ZU11EG.Rx/Tx, adi.FMComms8.Rx/Tx, adi.AD9371.Rx/ORx/Tx,
# adi.ADRV9371.Rx/Tx and adi.ADRV9002.Rx/Tx, and adi.common.JESD204, against
# libiio's emulation backend, see test/IIOv1EmuTests.m. Hosted runner only: no
# board, no self-hosted runner.

on:
  push:
    branches: [master, feat/libiio-v1-bindings]
  pull_request:
  workflow_dispatch:

concurrency:
  group: libiio-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The bindings, pinned. Its deps/build-libiio.sh pins libiio v1 in turn.
  LIBIIO_CONV_SHA: b60df436ee887eb81e2cd92c0a870bafb99e8622

jobs:
  emu:
    name: Device classes on emu (R2025b)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Only +adi/+common is needed; the other submodules are left out.
      - name: Check out the toolbox
        uses: actions/checkout@v4

      - name: Check out +adi/+common
        run: git submodule update --init -- '+adi/+common'

      - name: Check out the libiio v1 bindings
        uses: actions/checkout@v4
        with:
          repository: tfcollins/libiio-conv
          ref: ${{ env.LIBIIO_CONV_SHA }}
          path: libiio-conv

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libxml2-dev libzstd-dev bison flex

      - name: Cache pinned libiio v1
        uses: actions/cache@v4
        with:
          path: libiio-conv/deps/install
          key: libiio-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libiio-conv/deps/build-libiio.sh') }}

      - name: Build pinned libiio v1
        run: libiio-conv/deps/build-libiio.sh

      # The sampling rate tests compare with files that are the output of the
      # C source of libad9361-iio (ad9361_set_bb_rate) on the emu context files.
      # This makes them again and fails when the committed ones differ.
      - name: Check the expected files of the sampling rate tests
        run: |
          test/emu/ad9361_bb_rate/generate.sh libiio-conv/deps/install "$RUNNER_TEMP/bb_rate_expected"
          diff -r test/emu/ad9361_bb_rate/expected "$RUNNER_TEMP/bb_rate_expected"

      # The same for the multichip sync of the FMComms5
      # (ad9361_fmcomms5_multichip_sync).
      - name: Check the expected files of the multichip sync tests
        run: |
          test/emu/ad9361_mcs/generate.sh libiio-conv/deps/install "$RUNNER_TEMP/mcs_expected"
          diff -r test/emu/ad9361_mcs/expected "$RUNNER_TEMP/mcs_expected"

      # adrv9009.xml is put together from the two ADRV9008 context files. This
      # makes it again and fails when the committed one differs.
      - name: Check the ADRV9009 context file
        run: |
          python3 test/emu/make_adrv9009_xml.py test/emu/adrv9008-1.xml test/emu/adrv9008-2.xml "$RUNNER_TEMP/adrv9009.xml"
          cmp test/emu/adrv9009.xml "$RUNNER_TEMP/adrv9009.xml"

      # adrv9009zu11eg.xml and fmcomms8.xml (two ADRV9009) are put together
      # from adrv9009.xml. This makes them again and fails when the committed
      # ones differ.
      - name: Check the context files with two ADRV9009
        run: |
          python3 test/emu/make_adrv9009_dual_xml.py test/emu/adrv9009.xml adrv9009-phy adrv9009-phy-b "$RUNNER_TEMP/adrv9009zu11eg.xml"
          cmp test/emu/adrv9009zu11eg.xml "$RUNNER_TEMP/adrv9009zu11eg.xml"
          python3 test/emu/make_adrv9009_dual_xml.py test/emu/adrv9009.xml adrv9009-phy-c adrv9009-phy-d "$RUNNER_TEMP/fmcomms8.xml"
          cmp test/emu/fmcomms8.xml "$RUNNER_TEMP/fmcomms8.xml"

      # MATLAB alone: the device classes need matlab.System and nothing else.
      - name: Set up MATLAB
        id: setup-matlab
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
          cache: true

      - name: Locate MATLAB
        run: |
          root="${{ steps.setup-matlab.outputs.matlabroot }}"
          [ -n "$root" ] || root=$(dirname "$(dirname "$(readlink -f "$(command -v matlab)")")")
          test -f "$root/extern/include/mex.h"
          echo "MATLAB_ROOT=$root" >> "$GITHUB_ENV"

      # A MEX file as it is handed out: without the test commands of libiio-conv
      # (the test_* commands and the scripted backend). They are in only with
      # IIO_CONV_MEX_TEST_HOOKS=ON, which is off by default and not given here;
      # check_mex_hooks.sh fails when they are in all the same.
      # IIO_CONV_BUILD_TESTS=OFF leaves out the tests of libiio-conv itself.
      # MATLAB is not started by the build.
      - name: Build the MEX file
        run: |
          cmake -S libiio-conv -B libiio-conv/build-mex -G Ninja \
            -DIIO_CONV_BUILD_MATLAB=ON -DIIO_CONV_BUILD_TESTS=OFF \
            -DMatlab_ROOT_DIR="$MATLAB_ROOT"
          cmake --build libiio-conv/build-mex
          test -f libiio-conv/matlab/iio_mex.mexa64
          libiio-conv/matlab/tools/check_mex_hooks.sh libiio-conv/matlab/iio_mex.mexa64 without

      - name: Prepare the result folder
        run: mkdir -p test-results

      - name: MATLAB tests on the emu backend
        uses: matlab-actions/run-command@v2
        env:
          IIO_MEX_TRACE: ${{ github.workspace }}/test-results/iio-mex-trace.log
        with:
          command: addpath('test'); runEmuTests(fullfile(pwd, 'libiio-conv', 'matlab'), fullfile(pwd, 'test-results', 'emu.xml'));
          startup-options: -logfile test-results/matlab.log

      # A green test step says only that no test failed. This also fails the job
      # when tests did not run or were filtered. --min-tests is the number of
      # test points of IIOv1EmuTests (154: 21 methods for 3 boards, two for 6
      # cases each, one for 11 receivers, one for 9 transmitters, two for 2
      # files each, 10 for the 2 boards with two ADRV9009, 3 for the 2
      # packages of AD9371 classes, and 29);
      # raise it with every test that is added.
      - name: Check the test results (count, skipped, duration)
        if: always()
        run: python3 libiio-conv/matlab/tools/check_junit.py test-results/emu.xml --min-tests 155 --max-seconds 60 --max-skipped 0

      - name: Collect crash dumps
        if: always()
        run: mkdir -p test-results && cp ~/matlab_crash_dump.* test-results/ 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libiio-v1-emu-R2025b
          path: test-results/
