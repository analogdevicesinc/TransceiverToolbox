# MISS_HIT configuration for the Transceiver Toolbox MATLAB code.
# Reference: https://florianschanda.github.io/miss_hit/style_checker.html
#
# This is a first pass tuned to the existing codebase: it keeps the mechanical
# whitespace/indentation rules (which `mh_style --fix` can apply automatically)
# and relaxes the rules that would otherwise require breaking API changes or
# large manual rewrites.

# Anchor the project root here so MISS_HIT does not search parent directories.
project_root

# Indentation unit used throughout the toolbox.
tab_width: 4

# Pragmatic maximum line length. The existing code predates a strict limit
# (longest lines reach ~200 chars); 120 is a modern target that long lines are
# wrapped down to over time.
line_length: 120

# The public System object API uses PascalCase class names, properties, and
# methods (for example AD9361, CenterFrequency, SamplingRate). MISS_HIT's
# default naming scheme expects snake_case, so enforcing it would demand
# renaming the user-facing API. Suppress the naming rules instead.
suppress_rule: "naming_functions"
suppress_rule: "naming_classes"
suppress_rule: "naming_parameters"

# Source files do not yet carry a standard copyright header. Adding them is
# tracked as separate follow-up work rather than gating the build here.
suppress_rule: "copyright_notice"
